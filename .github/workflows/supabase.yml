name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - "done-mcp/supabase/migrations/**"
      - "done-mcp/supabase/functions/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SBACCESSTOKEN }}
      PROJECT_ID: uqnvtzblppjblwgbpqhf

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Run migrations
        run: |
          for f in done-mcp/supabase/migrations/*.sql; do
            echo "Applying $f..."
            curl -sf -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_ID/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": $(jq -Rs . < "$f")}" \
              && echo "OK" || echo "Skipped (already applied)"
          done

      - name: Deploy Edge Functions
        run: |
          for fn in api mcp oauth snapshot; do
            echo "Deploying $fn..."
            supabase functions deploy $fn \
              --project-ref $PROJECT_ID \
              --no-verify-jwt
          done
        working-directory: done-mcp
